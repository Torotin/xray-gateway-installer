# === Конфигурация плагина Firewall ===
# Версия: 2.0.0
# Автор: Xray Gateway Installer Team

# === Основные настройки ===
[firewall]
# Интервал проверки kill-switch (секунды)
check_interval = 5

# Таймаут для тестов блокировки (секунды)
test_timeout = 5

# Логирование
log_level = INFO
log_file = /var/log/xray-firewall.log

# === Настройки kill-switch ===
[killswitch]
# Включить автоматический kill-switch
auto_killswitch = true

# Интервал мониторинга (секунды)
monitor_interval = 5

# Включить watchdog
enable_watchdog = true

# === Исключения ===
[exclusions]
# Системные исключения (автоматически добавляются)
system_exclusions = true

# Пользовательские исключения
custom_exclusions = true

# Файлы исключений
cidr_file = /opt/xray/configs/exclude_cidrs.txt
ip_file = /opt/xray/configs/exclude_ips.txt
port_file = /opt/xray/configs/exclude_ports.txt

# === Настройки интерфейсов ===
[interfaces]
# Автоматическое определение интерфейсов
auto_detect = true

# Принудительное указание интерфейсов (если auto_detect = false)
# lan_interface = eth0
# wan_interface = eth1

# === Настройки iptables ===
[iptables]
# Принудительное использование legacy
force_legacy = true

# Очистка правил при остановке
cleanup_on_stop = true

# Создание резервных копий правил
backup_rules = false
